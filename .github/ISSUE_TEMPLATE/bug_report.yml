name: Bug report
description: Report a reproducible problem without private data
body:
  - type: input
    id: version
    attributes:
      label: XMi version
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host/version and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result, actual result and redacted error code
      description: Do not attach private designs, chats, API keys or databases.
    validations:
      required: true
